# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Per ref, and cancelling: a superseded site build has nothing to
    # contribute. The upstream template keyed the group so that PR runs each got
    # their own (`github.run_id`) while every non-PR run shared one, which made
    # consecutive merges queue behind each other and cancel while pending
    # instead of the newest simply superseding the oldest.
    concurrency:
      group: pkgdown-${{ github.ref }}
      cancel-in-progress: true
    # Backstop. Without one this inherits GitHub's 360-minute default; a healthy
    # build is ~10 min plus the dependency install. The site also pulls
    # bootstrap-toc from a CDN, which has hung rather than failed.
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs

# Enforces AGENTS.md's "this is the only agent instruction file" rule.
#
# The repo previously carried per-tool copies of the contributor rules
# (.github/copilot-instructions.md, .agent/rules/whep.md). They drifted — one
# forbade data.table, which the package Imports — and were deleted. A
# byte-identical CLAUDE.md copy then stood in for tools that did not read
# AGENTS.md. Claude Code (>= 2.1.277), Codex and Copilot all read AGENTS.md
# natively, so no per-tool copy is needed, and this check keeps any from
# coming back.
#
# An agent-instruction filename other than AGENTS.md must NOT be present.
name: agent-instructions

on:
  push:
    branches: [main, master]
  pull_request:

permissions: read-all

jobs:
  in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AGENTS.md must be the only agent instruction file
        run: |
          set -euo pipefail
          canonical=AGENTS.md
          test -f "$canonical" || { echo "::error::$canonical is missing"; exit 1; }

          # Names the common agent tools look for. Add to this list rather
          # than adding a second source of truth: point the tool at AGENTS.md
          # instead, so none of these filenames should exist.
          candidates="
          CLAUDE.md
          GEMINI.md
          .cursorrules
          .cursor/rules/whep.md
          .github/copilot-instructions.md
          .agent/rules/whep.md
          .windsurfrules
          "

          fail=0
          for f in $candidates; do
            [ -e "$f" ] || [ -L "$f" ] || continue
            echo "::error file=$f::a per-tool agent-instruction file reappeared. Claude Code, Codex and Copilot all read $canonical directly; edit $canonical and remove $f instead of starting a second source of truth."
            fail=1
          done

          exit $fail
